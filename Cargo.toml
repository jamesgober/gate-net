# =============================================================================
#  R E P S   ·   gate-net
# =============================================================================
[package]
name    = "gate-net"
version = "0.1.0"

# Minimum Supported Rust Version (MSRV)
rust-version = "1.85"
edition = "2024"

# License
license = "Apache-2.0 OR MIT"

# Readme
readme = "README.md"

# Description
description = "Authentication and sessions for Rust services: Argon2id passwords, hashed API keys and session tokens, rotation and revocation, TOTP, login throttling, and constant-time checks. Protocol-free."

# Keywords (5 max)
keywords = ["authentication", "session", "login", "password", "security"]

# Categories
categories = ["authentication", "network-programming"]

# Links
homepage      = "https://github.com/jamesgober/gate-net"
repository    = "https://github.com/jamesgober/gate-net"
documentation = "https://docs.rs/gate-net"

# Authors
authors = ["James Gober <me@jamesgober.com>"]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[lib]
name = "gate_net"
path = "src/lib.rs"


# FEATURE FLAGS
# #################################
[features]
default = []


# DEPENDENCIES
# #################################
[dependencies]
# None yet. Planned dependencies and the reason for each are listed in
# dev/PLAN.md; each is added with the first code that needs it.


# DEV DEPENDENCIES
# #################################
[dev-dependencies]


# RELEASE PROFILE
# #################################
[profile.release]
opt-level     = 3
lto           = "fat"
codegen-units = 1
panic         = "abort"
strip         = "symbols"
